<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    
    <!-- Primary Meta Tags -->
    <title>Authors Bureau - AI-Powered Book Writing, Design & Marketing Platform</title>
    <meta name="title" content="Authors Bureau - AI-Powered Book Writing, Design & Marketing Platform" />
    <meta name="description" content="Transform your book idea into a published bestseller in just 2 days. Join 10,000+ authors using AI-powered writing, professional design, marketing automation, and Amazon optimization tools." />
    <meta name="keywords" content="book writing software, AI writing assistant, book publishing platform, Amazon bestseller, self-publishing, book marketing, author platform, writing tools, book design, manuscript editing" />
    <meta name="author" content="Authors Bureau" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Authors Bureau - AI-Powered Book Writing Platform" />
    <meta property="og:description" content="Transform your book idea into a published bestseller in just 2 days with AI-powered tools." />
    <meta property="og:site_name" content="Authors Bureau" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Authors Bureau - AI-Powered Book Writing Platform" />
    <meta property="twitter:description" content="Transform your book idea into a published bestseller in just 2 days with AI-powered tools." />
    
    <!-- Structured Data / Schema.org -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Authors Bureau",
      "description": "AI-powered platform for book writing, design, marketing, and Amazon optimization",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "ratingCount": "10000",
        "bestRating": "5"
      },
      "creator": {
        "@type": "Organization",
        "name": "Authors Bureau"
      }
    }
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
